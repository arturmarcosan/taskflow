<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow — Gerenciador de Tarefas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0d0f14;
      --surface:  #13161e;
      --card:     #1a1e2a;
      --border:   #252a38;
      --accent:   #4fffb0;
      --accent2:  #ff6b6b;
      --accent3:  #ffd166;
      --text:     #e8eaf0;
      --muted:    #6b7280;
      --radius:   12px;
      --mono:     'Space Mono', monospace;
      --sans:     'Sora', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Noise overlay ─────────────────────────────────── */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none; z-index: 0;
    }

    /* ── Layout ─────────────────────────────────────────── */
    .wrapper { max-width: 960px; margin: 0 auto; padding: 2rem 1.5rem; position: relative; z-index: 1; }

    /* ── Header ─────────────────────────────────────────── */
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding-bottom: 2rem; border-bottom: 1px solid var(--border);
      margin-bottom: 2.5rem;
    }
    .logo { display: flex; align-items: center; gap: .75rem; }
    .logo-icon {
      width: 38px; height: 38px; border-radius: 10px;
      background: var(--accent); display: grid; place-items: center;
      font-size: 1.1rem;
    }
    .logo h1 { font-family: var(--mono); font-size: 1.25rem; letter-spacing: -.02em; }
    .logo span { color: var(--accent); }

    /* ── Stats bar ───────────────────────────────────────── */
    .stats-bar {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem;
      margin-bottom: 2.5rem;
    }
    .stat-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1rem 1.25rem;
      transition: transform .2s;
    }
    .stat-card:hover { transform: translateY(-2px); }
    .stat-label { font-size: .7rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin-bottom: .35rem; font-family: var(--mono); }
    .stat-value { font-size: 1.8rem; font-weight: 700; font-family: var(--mono); }
    .stat-card.green .stat-value { color: var(--accent); }
    .stat-card.red   .stat-value { color: var(--accent2); }
    .stat-card.yellow .stat-value { color: var(--accent3); }

    /* ── Form ────────────────────────────────────────────── */
    .form-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1.75rem; margin-bottom: 2rem;
    }
    .form-card h2 { font-size: 1rem; font-family: var(--mono); margin-bottom: 1.25rem; color: var(--accent); }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .form-grid .full { grid-column: 1 / -1; }

    label { display: block; font-size: .75rem; font-family: var(--mono); color: var(--muted); margin-bottom: .4rem; text-transform: uppercase; letter-spacing: .08em; }
    input, textarea, select {
      width: 100%; background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); font-family: var(--sans); font-size: .9rem;
      padding: .65rem .9rem; outline: none; transition: border-color .2s;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--accent); }
    textarea { resize: vertical; min-height: 80px; }

    .btn {
      display: inline-flex; align-items: center; gap: .5rem;
      padding: .65rem 1.4rem; border-radius: 8px; border: none;
      font-family: var(--mono); font-size: .85rem; cursor: pointer;
      transition: all .18s; font-weight: 700;
    }
    .btn-primary { background: var(--accent); color: #0d0f14; }
    .btn-primary:hover { background: #39f09a; box-shadow: 0 0 20px #4fffb040; }
    .btn-danger  { background: transparent; color: var(--accent2); border: 1px solid var(--accent2); }
    .btn-danger:hover { background: var(--accent2); color: #fff; }
    .btn-ghost   { background: transparent; color: var(--muted); border: 1px solid var(--border); }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

    .form-actions { display: flex; gap: .75rem; justify-content: flex-end; margin-top: 1.25rem; }

    /* ── Filters ─────────────────────────────────────────── */
    .filters {
      display: flex; gap: .75rem; margin-bottom: 1.5rem; flex-wrap: wrap; align-items: center;
    }
    .filters select { width: auto; }
    .filters label { display: none; }

    /* ── Task list ───────────────────────────────────────── */
    #lista-tarefas { display: flex; flex-direction: column; gap: .85rem; }

    .task-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1.25rem 1.5rem;
      display: flex; align-items: flex-start; gap: 1rem;
      animation: slideIn .25s ease; transition: box-shadow .2s;
    }
    .task-card:hover { box-shadow: 0 4px 24px #00000040; }
    @keyframes slideIn { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform: none; } }

    .task-check {
      width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--border);
      flex-shrink: 0; cursor: pointer; margin-top: 2px;
      transition: all .2s; display: grid; place-items: center;
    }
    .task-check.done { background: var(--accent); border-color: var(--accent); }
    .task-check.done::after { content: '✓'; font-size: .65rem; color: #0d0f14; font-weight: 700; }

    .task-body { flex: 1; }
    .task-title { font-weight: 600; font-size: .95rem; margin-bottom: .3rem; }
    .task-title.done { text-decoration: line-through; color: var(--muted); }
    .task-desc { font-size: .82rem; color: var(--muted); margin-bottom: .6rem; }
    .task-meta { display: flex; gap: .5rem; flex-wrap: wrap; }

    .badge {
      font-family: var(--mono); font-size: .65rem; padding: .2rem .55rem;
      border-radius: 20px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
    }
    .badge-pendente   { background: #ffd16622; color: var(--accent3); border: 1px solid #ffd16644; }
    .badge-andamento  { background: #4fffb022; color: var(--accent);  border: 1px solid #4fffb044; }
    .badge-concluida  { background: #6b728022; color: var(--muted);   border: 1px solid var(--border); }
    .badge-alta   { background: #ff6b6b22; color: var(--accent2); border: 1px solid #ff6b6b44; }
    .badge-media  { background: #ffd16622; color: var(--accent3); border: 1px solid #ffd16644; }
    .badge-baixa  { background: #4fffb022; color: var(--accent);  border: 1px solid #4fffb044; }

    .task-actions { display: flex; gap: .5rem; flex-shrink: 0; }
    .icon-btn {
      width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border);
      background: transparent; color: var(--muted); cursor: pointer;
      display: grid; place-items: center; font-size: .85rem; transition: all .15s;
    }
    .icon-btn:hover { border-color: var(--accent); color: var(--accent); }
    .icon-btn.del:hover { border-color: var(--accent2); color: var(--accent2); }

    /* ── Empty state ─────────────────────────────────────── */
    .empty {
      text-align: center; padding: 4rem 1rem; color: var(--muted);
      font-family: var(--mono); font-size: .85rem;
    }
    .empty .icon { font-size: 2.5rem; margin-bottom: 1rem; opacity: .4; }

    /* ── Toast ───────────────────────────────────────────── */
    #toast {
      position: fixed; bottom: 2rem; right: 2rem;
      background: var(--card); border: 1px solid var(--accent);
      color: var(--accent); font-family: var(--mono); font-size: .8rem;
      padding: .75rem 1.25rem; border-radius: 10px;
      box-shadow: 0 8px 32px #00000060;
      transform: translateY(80px); opacity: 0;
      transition: all .3s cubic-bezier(.34,1.56,.64,1);
      z-index: 9999; max-width: 300px;
    }
    #toast.show { transform: none; opacity: 1; }
    #toast.error { border-color: var(--accent2); color: var(--accent2); }

    /* ── Modal ───────────────────────────────────────────── */
    .modal-overlay {
      position: fixed; inset: 0; background: #0007; backdrop-filter: blur(4px);
      display: none; place-items: center; z-index: 1000;
    }
    .modal-overlay.open { display: grid; }
    .modal {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 16px; padding: 2rem; width: min(480px, 90vw);
      animation: popIn .25s ease;
    }
    @keyframes popIn { from { transform: scale(.92); opacity:0; } to { transform: none; opacity:1; } }
    .modal h2 { font-family: var(--mono); font-size: 1rem; color: var(--accent); margin-bottom: 1.25rem; }

    @media (max-width: 640px) {
      .stats-bar { grid-template-columns: 1fr 1fr; }
      .form-grid { grid-template-columns: 1fr; }
      .form-grid .full { grid-column: 1; }
    }
  </style>
</head>
<body>
<div class="wrapper">

  <!-- Header -->
  <header>
    <div class="logo">
      <div class="logo-icon">✦</div>
      <h1>Task<span>Flow</span></h1>
    </div>
    <span style="font-family:var(--mono);font-size:.75rem;color:var(--muted)">CRUD — Python + SQLite</span>
  </header>

  <!-- Stats -->
  <div class="stats-bar">
    <div class="stat-card"><div class="stat-label">Total</div><div class="stat-value" id="stat-total">0</div></div>
    <div class="stat-card yellow"><div class="stat-label">Pendentes</div><div class="stat-value" id="stat-pendente">0</div></div>
    <div class="stat-card green"><div class="stat-label">Em andamento</div><div class="stat-value" id="stat-andamento">0</div></div>
    <div class="stat-card" style="--accent:var(--muted)"><div class="stat-label">Concluídas</div><div class="stat-value" id="stat-concluida">0</div></div>
  </div>

  <!-- Form: Nova Tarefa -->
  <div class="form-card">
    <h2>// nova_tarefa</h2>
    <div class="form-grid">
      <div class="full">
        <label for="titulo">Título *</label>
        <input type="text" id="titulo" placeholder="Ex.: Estudar para a prova de BD..." />
      </div>
      <div class="full">
        <label for="descricao">Descrição</label>
        <textarea id="descricao" placeholder="Detalhes opcionais..."></textarea>
      </div>
      <div>
        <label for="status">Status</label>
        <select id="status">
          <option value="pendente">⏳ Pendente</option>
          <option value="em andamento">🔄 Em Andamento</option>
          <option value="concluida">✅ Concluída</option>
        </select>
      </div>
      <div>
        <label for="prioridade">Prioridade</label>
        <select id="prioridade">
          <option value="baixa">🟢 Baixa</option>
          <option value="media" selected>🟡 Média</option>
          <option value="alta">🔴 Alta</option>
        </select>
      </div>
    </div>
    <div class="form-actions">
      <button class="btn btn-primary" onclick="criarTarefa()">＋ Adicionar Tarefa</button>
    </div>
  </div>

  <!-- Filters -->
  <div class="filters">
    <label>Status</label>
    <select id="filtro-status" onchange="carregarTarefas()">
      <option value="">Todos os status</option>
      <option value="pendente">Pendente</option>
      <option value="em andamento">Em Andamento</option>
      <option value="concluida">Concluída</option>
    </select>
    <select id="filtro-prioridade" onchange="carregarTarefas()">
      <option value="">Todas as prioridades</option>
      <option value="alta">Alta</option>
      <option value="media">Média</option>
      <option value="baixa">Baixa</option>
    </select>
    <button class="btn btn-ghost" onclick="limparFiltros()">✕ Limpar filtros</button>
  </div>

  <!-- Lista -->
  <div id="lista-tarefas"></div>
</div>

<!-- Modal Edição -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2>// editar_tarefa</h2>
    <div class="form-grid">
      <input type="hidden" id="edit-id" />
      <div class="full">
        <label for="edit-titulo">Título *</label>
        <input type="text" id="edit-titulo" />
      </div>
      <div class="full">
        <label for="edit-descricao">Descrição</label>
        <textarea id="edit-descricao"></textarea>
      </div>
      <div>
        <label for="edit-status">Status</label>
        <select id="edit-status">
          <option value="pendente">⏳ Pendente</option>
          <option value="em andamento">🔄 Em Andamento</option>
          <option value="concluida">✅ Concluída</option>
        </select>
      </div>
      <div>
        <label for="edit-prioridade">Prioridade</label>
        <select id="edit-prioridade">
          <option value="baixa">🟢 Baixa</option>
          <option value="media">🟡 Média</option>
          <option value="alta">🔴 Alta</option>
        </select>
      </div>
    </div>
    <div class="form-actions" style="margin-top:1.25rem">
      <button class="btn btn-ghost" onclick="fecharModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="salvarEdicao()">💾 Salvar</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<script>
  const API = "http://localhost:5000";

  // ── Utilitários ───────────────────────────────────────────

  function toast(msg, tipo = "ok") {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.className = tipo === "erro" ? "error show" : "show";
    setTimeout(() => el.className = "", 3000);
  }

  function badgeStatus(s) {
    const map = { "pendente": "badge-pendente", "em andamento": "badge-andamento", "concluida": "badge-concluida" };
    const label = { "pendente": "Pendente", "em andamento": "Em Andamento", "concluida": "Concluída" };
    return `<span class="badge ${map[s] || ''}">${label[s] || s}</span>`;
  }

  function badgePrio(p) {
    const map = { "alta": "badge-alta", "media": "badge-media", "baixa": "badge-baixa" };
    const emoji = { "alta": "🔴", "media": "🟡", "baixa": "🟢" };
    return `<span class="badge ${map[p] || ''}">${emoji[p] || ''} ${p}</span>`;
  }

  // ── CRUD ──────────────────────────────────────────────────

  async function carregarTarefas() {
    const status     = document.getElementById("filtro-status").value;
    const prioridade = document.getElementById("filtro-prioridade").value;

    let url = `${API}/tarefas`;
    const params = new URLSearchParams();
    if (status)     params.append("status", status);
    if (prioridade) params.append("prioridade", prioridade);
    if ([...params].length) url += "?" + params.toString();

    const res = await fetch(url);
    const tarefas = await res.json();
    renderLista(tarefas);
    await carregarStats();
  }

  async function carregarStats() {
    const res  = await fetch(`${API}/tarefas/stats`);
    const data = await res.json();
    document.getElementById("stat-total").textContent     = data.total || 0;
    document.getElementById("stat-pendente").textContent  = data.por_status?.pendente || 0;
    document.getElementById("stat-andamento").textContent = data.por_status?.["em andamento"] || 0;
    document.getElementById("stat-concluida").textContent = data.por_status?.concluida || 0;
  }

  async function criarTarefa() {
    const titulo = document.getElementById("titulo").value.trim();
    if (!titulo) { toast("Título é obrigatório!", "erro"); return; }

    const payload = {
      titulo,
      descricao:  document.getElementById("descricao").value,
      status:     document.getElementById("status").value,
      prioridade: document.getElementById("prioridade").value,
    };

    const res = await fetch(`${API}/tarefas`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });

    if (res.ok) {
      document.getElementById("titulo").value    = "";
      document.getElementById("descricao").value = "";
      toast("✅ Tarefa criada!");
      carregarTarefas();
    } else {
      toast("Erro ao criar tarefa.", "erro");
    }
  }

  async function deletarTarefa(id) {
    if (!confirm("Excluir esta tarefa?")) return;
    const res = await fetch(`${API}/tarefas/${id}`, { method: "DELETE" });
    if (res.ok) { toast("🗑️ Tarefa excluída!"); carregarTarefas(); }
    else toast("Erro ao excluir.", "erro");
  }

  async function toggleStatus(id, statusAtual) {
    const proximo = statusAtual === "concluida" ? "pendente" : "concluida";
    await fetch(`${API}/tarefas/${id}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ status: proximo }),
    });
    carregarTarefas();
  }

  function abrirEdicao(tarefa) {
    document.getElementById("edit-id").value         = tarefa.id;
    document.getElementById("edit-titulo").value     = tarefa.titulo;
    document.getElementById("edit-descricao").value  = tarefa.descricao || "";
    document.getElementById("edit-status").value     = tarefa.status;
    document.getElementById("edit-prioridade").value = tarefa.prioridade;
    document.getElementById("modal").classList.add("open");
  }

  function fecharModal() {
    document.getElementById("modal").classList.remove("open");
  }

  async function salvarEdicao() {
    const id = document.getElementById("edit-id").value;
    const payload = {
      titulo:     document.getElementById("edit-titulo").value,
      descricao:  document.getElementById("edit-descricao").value,
      status:     document.getElementById("edit-status").value,
      prioridade: document.getElementById("edit-prioridade").value,
    };
    const res = await fetch(`${API}/tarefas/${id}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    if (res.ok) { toast("✏️ Tarefa atualizada!"); fecharModal(); carregarTarefas(); }
    else toast("Erro ao atualizar.", "erro");
  }

  function limparFiltros() {
    document.getElementById("filtro-status").value     = "";
    document.getElementById("filtro-prioridade").value = "";
    carregarTarefas();
  }

  // ── Render ────────────────────────────────────────────────

  function renderLista(tarefas) {
    const el = document.getElementById("lista-tarefas");
    if (!tarefas.length) {
      el.innerHTML = `<div class="empty"><div class="icon">◈</div>Nenhuma tarefa encontrada.</div>`;
      return;
    }
    el.innerHTML = tarefas.map(t => `
      <div class="task-card">
        <div class="task-check ${t.status === 'concluida' ? 'done' : ''}"
             onclick="toggleStatus(${t.id}, '${t.status}')"></div>
        <div class="task-body">
          <div class="task-title ${t.status === 'concluida' ? 'done' : ''}">${t.titulo}</div>
          ${t.descricao ? `<div class="task-desc">${t.descricao}</div>` : ''}
          <div class="task-meta">
            ${badgeStatus(t.status)}
            ${badgePrio(t.prioridade)}
            <span class="badge" style="color:var(--muted);border-color:var(--border)">#${t.id}</span>
          </div>
        </div>
        <div class="task-actions">
          <button class="icon-btn" onclick='abrirEdicao(${JSON.stringify(t)})' title="Editar">✎</button>
          <button class="icon-btn del" onclick="deletarTarefa(${t.id})" title="Excluir">✕</button>
        </div>
      </div>`).join("");
  }

  // Fechar modal clicando fora
  document.getElementById("modal").addEventListener("click", e => {
    if (e.target.id === "modal") fecharModal();
  });

  // Inicializa
  carregarTarefas();
</script>
</body>
</html>
